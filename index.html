<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA FC 27 Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            const [tab, setTab] = React.useState('matches');
            const [matches, setMatches] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_matches')) || []);
            const [stats, setStats] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_stats')) || { wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 });
            const [rivals, setRivals] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_rivals')) || { division: 10, step: 1 });
            const [fut, setFut] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_fut')) || { wins: 0, losses: 0 });

            React.useEffect(() => {
                localStorage.setItem('eafc27_matches', JSON.stringify(matches));
                localStorage.setItem('eafc27_stats', JSON.stringify(stats));
                localStorage.setItem('eafc27_rivals', JSON.stringify(rivals));
                localStorage.setItem('eafc27_fut', JSON.stringify(fut));
            }, [matches, stats, rivals, fut]);

            const addMatch = (e) => {
                e.preventDefault();
                const form = e.target;
                const match = {
                    id: Date.now(),
                    mode: form.mode.value,
                    opponent: form.opponent.value,
                    gf: parseInt(form.gf.value),
                    ga: parseInt(form.ga.value),
                    result: form.gf.value > form.ga.value ? 'W' : form.gf.value < form.ga.value ? 'L' : 'D'
                };
                setMatches([match, ...matches]);
                setStats(prev => ({
                    wins: prev.wins + (match.result === 'W' ? 1 : 0),
                    draws: prev.draws + (match.result === 'D' ? 1 : 0),
                    losses: prev.losses + (match.result === 'L' ? 1 : 0),
                    goalsFor: prev.goalsFor + match.gf,
                    goalsAgainst: prev.goalsAgainst + match.ga
                }));
                form.reset();
            };

            return (
                <div className="max-w-md mx-auto p-4 pb-20">
                    <header className="text-center my-6">
                        <h1 className="text-2xl font-black text-emerald-400 tracking-wider">EA FC 27 TRACKER</h1>
                        <p className="text-xs text-slate-400">Twoje mobilne centrum statystyk Ultimate Team</p>
                    </header>

                    <div className="flex bg-slate-900 p-1 rounded-xl mb-6 border border-slate-800">
                        <button onClick={() => setTab('matches')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition ${tab === 'matches' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}>Mecze</button>
                        <button onClick={() => setTab('rivals')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition ${tab === 'rivals' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}>Rivals</button>
                        <button onClick={() => setTab('fut')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition ${tab === 'fut' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}>FUT Champs</button>
                    </div>

                    {tab === 'matches' && (
                        <div>
                            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-6 shadow-xl">
                                <h2 className="text-sm font-bold text-slate-300 mb-3 uppercase tracking-wide">Bilans Ogólny</h2>
                                <div className="grid grid-cols-3 gap-2 text-center mb-4">
                                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800"><span className="block text-xl font-black text-emerald-400">{stats.wins}</span><span className="text-[10px] text-slate-400 uppercase">Wygrane</span></div>
                                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800"><span className="block text-xl font-black text-amber-400">{stats.draws}</span><span className="text-[10px] text-slate-400 uppercase">Remisy</span></div>
                                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800"><span className="block text-xl font-black text-rose-400">{stats.losses}</span><span className="text-[10px] text-slate-400 uppercase">Porażki</span></div>
                                </div>
                                <div className="text-xs text-slate-400 flex justify-between px-1">
                                    <span>Bramki: <strong className="text-slate-200">{stats.goalsFor} : {stats.goalsAgainst}</strong></span>
                                    <span>Bilans: <strong className={stats.goalsFor - stats.goalsAgainst >= 0 ? 'text-emerald-400' : 'text-rose-400'}>{stats.goalsFor - stats.goalsAgainst}</strong></span>
                                </div>
                            </div>

                            <form onSubmit={addMatch} className="bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-6 shadow-xl space-y-3">
                                <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wide">Dodaj Wynik Meczu</h2>
                                <div className="grid grid-cols-2 gap-2">
                                    <select name="mode" className="bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-200">
                                        <option value="Division Rivals">Division Rivals</option>
                                        <option value="FUT Champions">FUT Champions</option>
                                        <option value="Draft">Draft</option>
                                        <option value="Towarzyski">Towarzyski</option>
                                    </select>
                                    <input type="text" name="opponent" placeholder="Rywal (opcjonalnie)" className="bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-200" />
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <input type="number" name="gf" placeholder="Twoje gole" required min="0" className="bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-200" />
                                    <input type="number" name="ga" placeholder="Gole rywala" required min="0" className="bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-200" />
                                </div>
                                <button type="submit" className="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs uppercase tracking-wider hover:bg-emerald-400 transition">Zapisz Mecz</button>
                            </form>

                            <div className="space-y-2">
                                <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wide">Ostatnie Mecze</h2>
                                {matches.length === 0 ? (
                                    <p className="text-xs text-slate-500 text-center py-6">Brak rozegranych meczów w historii.</p>
                                ) : (
                                    matches.map(m => (
                                        <div key={m.id} className="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center">
                                            <div>
                                                <span className="text-[10px] text-emerald-400 font-bold uppercase tracking-wider block">{m.mode}</span>
                                                <span className="text-xs text-slate-300">{m.opponent || 'Przeciwnik Online'}</span>
                                            </div>
                                            <div className="text-right">
                                                <span className={`text-sm font-black px-2 py-0.5 rounded-lg ${m.result === 'W' ? 'bg-emerald-500/20 text-emerald-400' : m.result === 'L' ? 'bg-rose-500/20 text-rose-400' : 'bg-amber-500/20 text-amber-400'}`}>
                                                    {m.gf} : {m.ga}
                                                </span>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}

                    {tab === 'rivals' && (
                        <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl space-y-4">
                            <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wide">Division Rivals</h2>
                            <div>
                                <label className="text-xs text-slate-400 block mb-1">Wybierz Dywizję:</label>
                                <select value={rivals.division} onChange={e => setRivals({...rivals, division: Number(e.target.value)})} className="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-sm text-slate-200 font-bold">
                                    {[...Array(10)].map((_, i) => (
                                        <option key={10 - i} value={10 - i}>Dywizja {10 - i}</option>
                                    ))}
                                    <option value="Elite">Elite Division</option>
                                </select>
                            </div>
                            <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-center">
                                <span className="text-xs text-slate-400 uppercase block mb-1">Twój aktualny poziom</span>
                                <span className="text-2xl font-black text-emerald-400">Dywizja {rivals.division}</span>
                            </div>
                        </div>
                    )}

                    {tab === 'fut' && (
                        <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl space-y-4">
                            <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wide">Finały FUT Champions</h2>
                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                                    <label className="text-xs text-slate-400 block mb-1">Wygrane:</label>
                                    <input type="number" min="0" max="20" value={fut.wins} onChange={e => setFut({...fut, wins: Number(e.target.value)})} className="w-full bg-slate-900 border border-slate-800 p-2 rounded-xl text-sm text-slate-200 font-bold text-center" />
                                </div>
                                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                                    <label className="text-xs text-slate-400 block mb-1">Porażki:</label>
                                    <input type="number" min="0" max="20" value={fut.losses} onChange={e => setFut({...fut, losses: Number(e.target.value)})} className="w-full bg-slate-900 border border-slate-800 p-2 rounded-xl text-sm text-slate-200 font-bold text-center" />
                                </div>
                            </div>
                            <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-center">
                                <span className="text-xs text-slate-400 uppercase block mb-1">Bilans Finałów</span>
                                <span className="text-2xl font-black text-emerald-400">{fut.wins} - {fut.losses}</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
