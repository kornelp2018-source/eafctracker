        const BENCH_POSITIONS = ['SUB 1', 'SUB 2', 'SUB 3', 'SUB 4', 'SUB 5', 'SUB 6', 'SUB 7'];

        function App() {
            const [tab, setTab] = React.useState('squad');
            const [matches, setMatches] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_matches')) || []);
            const [stats, setStats] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_stats')) || { wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 });
            const [rivals, setRivals] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_rivals')) || { division: 10 });
            const [fut, setFut] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_fut')) || { wins: 0, losses: 0 });
            
            const [formation, setFormation] = React.useState(() => localStorage.getItem('eafc27_formation') || '4-3-3 (1)');
            const [squad, setSquad] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_squad')) || {});
            const [bench, setBench] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_bench')) || {});
            const [legends, setLegends] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_legends')) || []);

            const [selectedPos, setSelectedPos] = React.useState(null);
            const [isBenchSelection, setIsBenchSelection] = React.useState(false);
            const [playerName, setPlayerName] = React.useState('');
            const [playerOvr, setPlayerOvr] = React.useState('');

            React.useEffect(() => {
                localStorage.setItem('eafc27_matches', JSON.stringify(matches));
                localStorage.setItem('eafc27_stats', JSON.stringify(stats));
                localStorage.setItem('eafc27_rivals', JSON.stringify(rivals));
                localStorage.setItem('eafc27_fut', JSON.stringify(fut));
                localStorage.setItem('eafc27_formation', formation);
                localStorage.setItem('eafc27_squad', JSON.stringify(squad));
                localStorage.setItem('eafc27_bench', JSON.stringify(bench));
                localStorage.setItem('eafc27_legends', JSON.stringify(legends));
            }, [matches, stats, rivals, fut, formation, squad, bench, legends]);

            const addMatch = (e) => {
                e.preventDefault();
                const form = e.target;
                const match = {
                    id: Date.now(),
                    mode: form.mode.value,
                    opponent: form.opponent.value,
                    gf: parseInt(form.gf.value),
                    ga: parseInt(form.ga.value),
                    result: form.gf.value > form.ga.value ? 'W' : form.gf.value < form.ga.value ? 'L' : 'D'
                };
                setMatches([match, ...matches]);
                setStats(prev => ({
                    wins: prev.wins + (match.result === 'W' ? 1 : 0),
                    draws: prev.draws + (match.result === 'D' ? 1 : 0),
                    losses: prev.losses + (match.result === 'L' ? 1 : 0),
                    goalsFor: prev.goalsFor + match.gf,
                    goalsAgainst: prev.goalsAgainst + match.ga
                }));
                form.reset();
            };

            const assignPlayer = (e) => {
                e.preventDefault();
                if (!selectedPos) return;

                if (isBenchSelection) {
                    setBench({
                        ...bench,
                        [selectedPos]: { name: playerName, ovr: playerOvr || '80' }
                    });
                } else {
                    setSquad({
                        ...squad,
                        [selectedPos]: { name: playerName, ovr: playerOvr || '80' }
                    });
                }
                setSelectedPos(null);
                setPlayerName('');
                setPlayerOvr('');
            };

                if (isBench) {
                    const newBench = { ...bench };
                    delete newBench[pos];
                    setBench(newBench);
                } else {
                    const newSquad = { ...squad };
                    delete newSquad[pos];
                    setSquad(newSquad);
                }
            };

                    name: form.lname.value,
                    pos: form.lpos.value,
