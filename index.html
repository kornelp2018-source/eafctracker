<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA FC 27 Tracker & Squad Builder</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pitch-bg {
            background: #15803d;
            background-image: 
                linear-gradient(to bottom, rgba(255,255,255,0.12) 1px, transparent 1px),
                linear-gradient(to right, rgba(255,255,255,0.05) 50%, transparent 50%);
            background-size: 100% 40px, 100% 100%;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        const FORMATIONS = {
            '4-3-3 (1)': [
                { pos: 'LW', top: '22%', left: '18%' }, { pos: 'ST', top: '15%', left: '50%' }, { pos: 'RW', top: '22%', left: '82%' },
                { pos: 'LCM', top: '45%', left: '28%' }, { pos: 'CM', top: '50%', left: '50%' }, { pos: 'RCM', top: '45%', left: '72%' },
                { pos: 'LB', top: '72%', left: '15%' }, { pos: 'CB1', top: '75%', left: '38%' }, { pos: 'CB2', top: '75%', left: '62%' }, { pos: 'RB', top: '72%', left: '85%' },
                { pos: 'GK', top: '90%', left: '50%' }
            ],
            '4-3-3 (2) (Cofnięty)': [
                { pos: 'LW', top: '22%', left: '18%' }, { pos: 'ST', top: '15%', left: '50%' }, { pos: 'RW', top: '22%', left: '82%' },
                { pos: 'LCM', top: '42%', left: '30%' }, { pos: 'RCM', top: '42%', left: '70%' }, { pos: 'CDM', top: '56%', left: '50%' },
                { pos: 'LB', top: '72%', left: '15%' }, { pos: 'CB1', top: '75%', left: '38%' }, { pos: 'CB2', top: '75%', left: '62%' }, { pos: 'RB', top: '72%', left: '85%' },
                { pos: 'GK', top: '90%', left: '50%' }
            ],
            '4-3-3 (3) (Ofensywny)': [
                { pos: 'LW', top: '22%', left: '18%' }, { pos: 'ST', top: '15%', left: '50%' }, { pos: 'RW', top: '22%', left: '82%' },
                { pos: 'CAM', top: '35%', left: '50%' }, { pos: 'LCDM', top: '52%', left: '35%' }, { pos: 'RCDM', top: '52%', left: '65%' },
                { pos: 'LB', top: '72%', left: '15%' }, { pos: 'CB1', top: '75%', left: '38%' }, { pos: 'CB2', top: '75%', left: '62%' }, { pos: 'RB', top: '72%', left: '85%' },
                { pos: 'GK', top: '90%', left: '50%' }
            ],
            '4-4-2 (Klasyczna)': [
                { pos: 'ST1', top: '16%', left: '35%' }, { pos: 'ST2', top: '16%', left: '65%' },
                { pos: 'LM', top: '42%', left: '15%' }, { pos: 'CM1', top: '46%', left: '38%' }, { pos: 'CM2', top: '46%', left: '62%' }, { pos: 'RM', top: '42%', left: '85%' },
                { pos: 'LB', top: '72%', left: '15%' }, { pos: 'CB1', top: '75%', left: '38%' }, { pos: 'CB2', top: '75%', left: '62%' }, { pos: 'RB', top: '72%', left: '85%' },
                { pos: 'GK', top: '90%', left: '50%' }
            ],
            '4-2-3-1 (Wąsko)': [
                { pos: 'ST', top: '14%', left: '50%' },
                { pos: 'LAM', top: '28%', left: '24%' }, { pos: 'CAM', top: '30%', left: '50%' }, { pos: 'RAM', top: '28%', left: '76%' },
                { pos: 'LCDM', top: '52%', left: '35%' }, { pos: 'RCDM', top: '52%', left: '65%' },
                { pos: 'LB', top: '72%', left: '15%' }, { pos: 'CB1', top: '75%', left: '38%' }, { pos: 'CB2', top: '75%', left: '62%' }, { pos: 'RB', top: '72%', left: '85%' },
                { pos: 'GK', top: '90%', left: '50%' }
            ],
            '4-1-2-1-2 (Diament)': [
                { pos: 'ST1', top: '15%', left: '35%' }, { pos: 'ST2', top: '15%', left: '65%' },
                { pos: 'CAM', top: '32%', left: '50%' },
                { pos: 'LM', top: '46%', left: '22%' }, { pos: 'RM', top: '46%', left: '78%' },
                { pos: 'CDM', top: '60%', left: '50%' },
                { pos: 'LB', top: '74%', left: '15%' }, { pos: 'CB1', top: '76%', left: '38%' }, { pos: 'CB2', top: '76%', left: '62%' }, { pos: 'RB', top: '74%', left: '85%' },
                { pos: 'GK', top: '90%', left: '50%' }
            ],
            '3-5-2': [
                { pos: 'ST1', top: '15%', left: '35%' }, { pos: 'ST2', top: '15%', left: '65%' },
                { pos: 'CAM', top: '32%', left: '50%' },
                { pos: 'LM', top: '48%', left: '15%' }, { pos: 'CDM1', top: '52%', left: '38%' }, { pos: 'CDM2', top: '52%', left: '62%' }, { pos: 'RM', top: '48%', left: '85%' },
                { pos: 'CB1', top: '75%', left: '25%' }, { pos: 'CB2', top: '77%', left: '50%' }, { pos: 'CB3', top: '75%', left: '75%' },
                { pos: 'GK', top: '90%', left: '50%' }
            ],
            '5-3-2': [
                { pos: 'ST1', top: '16%', left: '35%' }, { pos: 'ST2', top: '16%', left: '65%' },
                { pos: 'LCM', top: '45%', left: '28%' }, { pos: 'CM', top: '48%', left: '50%' }, { pos: 'RCM', top: '45%', left: '72%' },
                { pos: 'LWB', top: '68%', left: '12%' }, { pos: 'CB1', top: '75%', left: '30%' }, { pos: 'CB2', top: '76%', left: '50%' }, { pos: 'CB3', top: '75%', left: '70%' }, { pos: 'RWB', top: '68%', left: '88%' },
                { pos: 'GK', top: '90%', left: '50%' }
            ]
        };

        const BENCH_POSITIONS = ['SUB 1', 'SUB 2', 'SUB 3', 'SUB 4', 'SUB 5', 'SUB 6', 'SUB 7'];
        const ROMAN_NUMERALS = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII'];

        const getDivisionStagesCount = (div) => {
            if (div === 'Elite') return 0;
            const d = Number(div);
            if (d >= 8) return 10;
            if (d >= 6) return 11;
            if (d >= 3) return 12;
            return 13;
        };

        const getStagesList = (maxCount) => {
            const stages = [];
            for (let i = 1; i <= maxCount; i++) {
                const isCP = (i === 1 || i === 4 || i === 7 || i === 10 || i === maxCount);
                stages.push({ id: i, label: ROMAN_NUMERALS[i - 1], isCheckpoint: isCP });
            }
            return stages;
        };

        function App() {
            const [tab, setTab] = React.useState('squad');
            const [matches, setMatches] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_matches_v6')) || []);
            
            const [rivals, setRivals] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_rivals_v6')) || { 
                division: 10, 
                currentStage: 1, 
                weeklyPoints: 0, 
                winStreak: 0, 
                wins: 0, 
                draws: 0, 
                losses: 0,
                history: []
            });

            const [fut, setFut] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_fut_v6')) || { 
                currentWeek: 1, 
                wins: 0, 
                losses: 0, 
                mvp: '', 
                weeksHistory: [],
                matches: [] 
            });

            const [formation, setFormation] = React.useState(() => localStorage.getItem('eafc27_formation_v6') || '4-3-3 (1)');
            const [squad, setSquad] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_squad_v6')) || {});
            const [bench, setBench] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_bench_v6')) || {});
            const [legends, setLegends] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_legends_v6')) || []);

            const [selectedPos, setSelectedPos] = React.useState(null);
            const [isBenchSelection, setIsBenchSelection] = React.useState(false);
            
            // Pola formularza zawodnika
            const [playerName, setPlayerName] = React.useState('');
            const [playerPosField, setPlayerPosField] = React.useState('');
            const [playerOvr, setPlayerOvr] = React.useState('');
            const [playerCardType, setPlayerCardType] = React.useState('Złota');
            const [playerMatchesCount, setPlayerMatchesCount] = React.useState('');
            const [playerGoalsCount, setPlayerGoalsCount] = React.useState('');
            const [playerAssistsCount, setPlayerAssistsCount] = React.useState('');
            const [playerPhoto, setPlayerPhoto] = React.useState('');

            // Pola meczowe
            const [gfGoals, setGfGoals] = React.useState('');
            const [gaGoals, setGaGoals] = React.useState('');
            const [matchScorers, setMatchScorers] = React.useState([]);
            const [currentScorer, setCurrentScorer] = React.useState('');
            const [currentMinute, setCurrentMinute] = React.useState('');
            const [redCard, setRedCard] = React.useState(false);
            const [penaltyFor, setPenaltyFor] = React.useState('none');

            React.useEffect(() => {
                localStorage.setItem('eafc27_matches_v6', JSON.stringify(matches));
                localStorage.setItem('eafc27_rivals_v6', JSON.stringify(rivals));
                localStorage.setItem('eafc27_fut_v6', JSON.stringify(fut));
                localStorage.setItem('eafc27_formation_v6', formation);
                localStorage.setItem('eafc27_squad_v6', JSON.stringify(squad));
                localStorage.setItem('eafc27_bench_v6', JSON.stringify(bench));
                localStorage.setItem('eafc27_legends_v6', JSON.stringify(legends));
            }, [matches, rivals, fut, formation, squad, bench, legends]);

            const maxStages = getDivisionStagesCount(rivals.division);

            const handleRivalsMatchOutcome = (result) => {
                setRivals(prev => {
                    if (prev.division === 'Elite') {
                        return {
                            ...prev,
                            wins: prev.wins + (result === 'W' ? 1 : 0),
                            draws: prev.draws + (result === 'D' ? 1 : 0),
                            losses: prev.losses + (result === 'L' ? 1 : 0),
                            weeklyPoints: prev.weeklyPoints + (result === 'W' ? 3 : result === 'D' ? 1 : 0)
                        };
                    }

                    let newStreak = prev.winStreak;
                    let newStage = prev.currentStage;
                    let wins = prev.wins;
                    let draws = prev.draws;
                    let losses = prev.losses;
                    let addPts = 0;

                    if (result === 'W') {
                        wins += 1;
                        addPts = 3;
                        newStreak += 1;
                        const step = newStreak >= 2 ? 2 : 1;
                        newStage = newStage + step;
                    } else if (result === 'D') {
                        draws += 1;
                        addPts = 1;
                        newStreak = 0;
                    } else if (result === 'L') {
                        losses += 1;
                        addPts = 0;
                        newStreak = 0;
                        const stagesList = getStagesList(maxStages);
                        const currentStageObj = stagesList.find(s => s.id === newStage);
                        if (!currentStageObj || !currentStageObj.isCheckpoint) {
                            newStage = Math.max(1, newStage - 1);
                        }
                    }

                    if (newStage >= maxStages && result === 'W') {
                        const nextDiv = prev.division === 1 ? 'Elite' : prev.division - 1;
                        const historyItem = {
                            division: prev.division === 'Elite' ? 'Elite' : `Dywizja ${prev.division}`,
                            wins,
                            draws,
                            losses,
                            date: new Date().toLocaleDateString('pl-PL')
                        };

                        return {
                            ...prev,
                            division: nextDiv,
                            currentStage: 1,
                            winStreak: 0,
                            wins: 0,
                            draws: 0,
                            losses: 0,
                            weeklyPoints: prev.weeklyPoints + addPts,
                            history: [historyItem, ...(prev.history || [])]
                        };
                    }

                    return {
                        ...prev,
                        wins,
                        draws,
                        losses,
                        winStreak: newStreak,
                        currentStage: Math.min(maxStages, newStage),
                        weeklyPoints: prev.weeklyPoints + addPts
                    };
                });
            };

            const undoRivalsOutcome = (result) => {
                setRivals(prev => {
                    let wins = prev.wins;
                    let draws = prev.draws;
                    let losses = prev.losses;
                    let weeklyPts = prev.weeklyPoints;
                    let newStage = prev.currentStage;
                    let newStreak = prev.winStreak;

                    if (result === 'W' && wins > 0) {
                        wins -= 1;
                        weeklyPts = Math.max(0, weeklyPts - 3);
                        newStage = Math.max(1, newStage - (newStreak >= 2 ? 2 : 1));
                        newStreak = Math.max(0, newStreak - 1);
                    } else if (result === 'D' && draws > 0) {
                        draws -= 1;
                        weeklyPts = Math.max(0, weeklyPts - 1);
                    } else if (result === 'L' && losses > 0) {
                        losses -= 1;
                        newStage = Math.min(maxStages, newStage + 1);
                    }

                    return {
                        ...prev,
                        wins,
                        draws,
                        losses,
                        weeklyPoints: weeklyPts,
                        currentStage: newStage,
                        winStreak: newStreak
                    };
                });
            };

            const moveStageManually = (direction) => {
                setRivals(prev => {
                    let target = prev.currentStage + direction;
                    if (target < 1) target = 1;
                    if (target > maxStages) target = maxStages;
                    return { ...prev, currentStage: target };
                });
            };

            const addScorerToMatch = () => {
                if (!currentScorer.trim()) return;
                const formattedName = currentScorer.trim().charAt(0).toUpperCase() + currentScorer.trim().slice(1).toLowerCase();
                setMatchScorers([...matchScorers, { name: formattedName, minute: currentMinute.trim() }]);
                setCurrentScorer('');
                setCurrentMinute('');
            };

            const removeScorer = (idx) => {
                setMatchScorers(matchScorers.filter((_, i) => i !== idx));
            };

            const addMatch = (e) => {
                e.preventDefault();
                const form = e.target;
                const mode = form.mode.value;
                const gf = parseInt(gfGoals);
                const ga = parseInt(gaGoals);
                const result = gf > ga ? 'W' : gf < ga ? 'L' : 'D';

                const match = {
                    id: Date.now(),
                    mode,
                    opponent: form.opponent.value || 'Przeciwnik',
                    gf,
                    ga,
                    result,
                    scorers: matchScorers,
                    redCard,
                    penaltyFor
                };

                setMatches([match, ...matches]);

                if (mode === 'Division Rivals') {
                    handleRivalsMatchOutcome(result);
                } else if (mode === 'FUT Champions') {
                    setFut(prev => ({
                        ...prev,
                        wins: prev.wins + (result === 'W' ? 1 : 0),
                        losses: prev.losses + (result === 'L' ? 1 : 0),
                        matches: [match, ...(prev.matches || [])]
                    }));
                }

                setGfGoals('');
                setGaGoals('');
                setMatchScorers([]);
                setRedCard(false);
                setPenaltyFor('none');
                form.reset();
            };

            const deleteMatch = (id) => {
                setMatches(matches.filter(m => m.id !== id));
            };

            const openPositionModal = (pos, isB) => {
                setSelectedPos(pos);
                setIsBenchSelection(isB);
                const currentData = isB ? bench[pos] : squad[pos];
                if (currentData) {
                    setPlayerName(currentData.name);
                    setPlayerOvr(currentData.ovr);
                    setPlayerCardType(currentData.cardType || 'Złota');
                    setPlayerPhoto(currentData.photo || '');
                } else {
                    setPlayerName('');
                    setPlayerOvr('');
                    setPlayerCardType('Złota');
                    setPlayerPhoto('');
                }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setPlayerPhoto(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const assignPlayer = (e) => {
                e.preventDefault();
                if (!selectedPos) return;

                const formattedName = playerName.trim().charAt(0).toUpperCase() + playerName.trim().slice(1).toLowerCase();
                const playerData = { 
                    name: formattedName, 
                    ovr: playerOvr || '80', 
                    cardType: playerCardType.trim(), 
                    photo: playerPhoto 
                };

                if (isBenchSelection) {
                    setBench({ ...bench, [selectedPos]: playerData });
                } else {
                    setSquad({ ...squad, [selectedPos]: playerData });
                }
                setSelectedPos(null);
            };

            // Ręczne dodawanie Legendy / Statystyk do zakładki Zawodnicy
            const handleAddLegend = (e) => {
                e.preventDefault();
                const newLegend = {
                    id: Date.now(),
                    name: playerName.trim(),
                    pos: playerPosField.trim() || 'ST',
                    ovr: playerOvr || '85',
                    cardType: playerCardType || 'Złota',
                    matches: playerMatchesCount || '0',
                    goals: playerGoalsCount || '0',
                    assists: playerAssistsCount || '0',
                    photo: playerPhoto
                };
                setLegends([...legends, newLegend]);
                setPlayerName('');
                setPlayerPosField('');
                setPlayerOvr('');
                setPlayerMatchesCount('');
                setPlayerGoalsCount('');
                setPlayerAssistsCount('');
                setPlayerPhoto('');
            };

            const deleteLegend = (id) => {
                setLegends(legends.filter(l => l.id !== id));
            };

            const archiveFutWeek = () => {
                if (fut.wins === 0 && fut.losses === 0) return;
                const weekRecord = {
                    week: fut.currentWeek,
                    wins: fut.wins,
                    losses: fut.losses,
                    mvp: fut.mvp || 'Brak'
                };
                setFut({
                    currentWeek: fut.currentWeek + 1,
                    wins: 0,
                    losses: 0,
                    mvp: '',
                    weeksHistory: [weekRecord, ...(fut.weeksHistory || [])],
                    matches: []
                });
            };

            const currentStagesList = getStagesList(maxStages);

            return (
                <div className="max-w-md mx-auto p-3 pb-20">
                    <header className="text-center my-4">
                        <h1 className="text-2xl font-black text-emerald-400 tracking-wider">EA FC 27 TRACKER</h1>
                        <p className="text-[11px] text-slate-400">Twoje Mobilne Centrum Ultimate Team</p>
                    </header>

                    <div className="grid grid-cols-6 gap-1 bg-slate-900 p-1 rounded-xl mb-4 border border-slate-800 text-center text-[9px]">
                        <button onClick={() => setTab('squad')} className={`py-2 font-bold rounded-lg transition ${tab === 'squad' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}>Boisko</button>
                        <button onClick={() => setTab('players')} className={`py-2 font-bold rounded-lg transition ${tab === 'players' ? 'bg-amber-400 text-slate-950' : 'text-slate-400'}`}>Zawodnicy</button>
                        <button onClick={() => setTab('matches')} className={`py-2 font-bold rounded-lg transition ${tab === 'matches' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}>Mecze</button>
                        <button onClick={() => setTab('rivals')} className={`py-2 font-bold rounded-lg transition ${tab === 'rivals' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}>Rivals</button>
                        <button onClick={() => setTab('fut')} className={`py-2 font-bold rounded-lg transition ${tab === 'fut' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}>FUT</button>
                        <button onClick={() => setTab('history')} className={`py-2 font-bold rounded-lg transition ${tab === 'history' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}>Historia</button>
                    </div>

                    {/* ZAKŁADKA ZAWODNICY (LEGENDY / STATYSTYKI / 1. SKŁAD) */}
                    {tab === 'players' && (
                        <div className="space-y-4">
                            {/* FORMULARZ DODAWANIA DO LEGEND / STATYSTYK */}
                            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl space-y-3">
                                <h2 className="text-sm font-black text-amber-400 uppercase tracking-wide">Dodaj Legendę / Statystyki Gracza</h2>
                                <form onSubmit={handleAddLegend} className="space-y-2">
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="text" placeholder="Imię / Nazwisko" required value={playerName} onChange={e => setPlayerName(e.target.value)} className="bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-200" />
                                        <input type="text" placeholder="Pozycja (np. ST)" required value={playerPosField} onChange={e => setPlayerPosField(e.target.value)} className="bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-200" />
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">
                                        <input type="number" placeholder="OVR" value={playerOvr} onChange={e => setPlayerOvr(e.target.value)} className="bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-200" />
                                        <input type="text" placeholder="Karta (np. TOTY)" value={playerCardType} onChange={e => setPlayerCardType(e.target.value)} className="bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-200" />
                                        <input type="number" placeholder="Mecze" value={playerMatchesCount} onChange={e => setPlayerMatchesCount(e.target.value)} className="bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-200" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="number" placeholder="Gole" value={playerGoalsCount} onChange={e => setPlayerGoalsCount(e.target.value)} className="bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-200" />
                                        <input type="number" placeholder="Asysty" value={playerAssistsCount} onChange={e => setPlayerAssistsCount(e.target.value)} className="bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-200" />
                                    </div>
                                    <div>
                                        <label className="text-[10px] text-slate-400 block mb-1">Zdjęcie zawodnika:</label>
                                        <input type="file" accept="image/*" onChange={handleImageUpload} className="w-full bg-slate-950 border border-slate-800 p-1.5 rounded-xl text-xs text-slate-300 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-amber-400 file:text-slate-950" />
                                    </div>
                                    <button type="submit" className="w-full bg-amber-400 text-slate-950 font-bold py-2 rounded-xl text-xs uppercase">Dodaj do Legend Klubu</button>
                                </form>
                            </div>

                            {/* LISTA LEGEND KLUBU */}
                            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl space-y-3">
                                <h2 className="text-xs font-black text-amber-400 uppercase tracking-wide">👑 Legendy Klubu & Statystyki</h2>
                                {legends.length > 0 ? (
                                    <div className="space-y-2">
                                        {legends.map((l) => (

                                    <input type="text" name="opponent" placeholder="Nazwa Rywala" className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-slate-200 font-bold" />
                                    <div className="grid grid-cols-2 gap-2">
                                        <input type="number" value={gfGoals} onChange={e => setGfGoals(e.target.value)} placeholder="Twoje gole" required min="0" className="bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-slate-200 font-bold" />
                                        <input type="number" value={gaGoals} onChange={e => setGaGoals(e.target.value)} placeholder="Gole rywala" required min="0" className="bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-slate-200 font-bold" />
                                    </div>

                                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                                        <label className="text-[10px] text-slate-400 font-bold block">Strzelcy bramek i minuty:</label>
                                        <div className="flex gap-2">
                                            <input 
                                                type="text" 
                                                placeholder="Strzelec (np. Mbappe)" 
                                                value={currentScorer} 
                                                onChange={e => setCurrentScorer(e.target.value)}
                                                className="flex-1 bg-slate-900 border border-slate-800 p-2 rounded-lg text-xs text-slate-200"
                                            />
                                            <input 
                                                type="text" 
                                                placeholder="Min (np. 45')" 
                                                value={currentMinute} 
                                                onChange={e => setCurrentMinute(e.target.value)}
                                                className="w-20 bg-slate-900 border border-slate-800 p-2 rounded-lg text-xs text-slate-200"
                                            />
                                            <button type="button" onClick={addScorerToMatch} className="bg-amber-400 text-slate-950 font-bold px-3 py-2 rounded-lg text-xs">+</button>
                                        </div>

                                        {matchScorers.length > 0 && (
                                            <div className="flex flex-wrap gap-1 pt-1">
                                                {matchScorers.map((s, idx) => (
                                                    <span key={idx} className="bg-slate-900 border border-slate-800 text-[10px] text-amber-300 font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                                                        ⚽ {s.name} {s.minute ? `(${s.minute}')` : ''}
                                                        <button type="button" onClick={() => removeScorer(idx)} className="text-rose-400 font-black ml-1">×</button>
                                                    </span>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    <div className="grid grid-cols-2 gap-2 text-[10px]">
                                        <label className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex items-center space-x-2 cursor-pointer">
                                            <input type="checkbox" checked={redCard} onChange={e => setRedCard(e.target.checked)} className="rounded text-emerald-500 focus:ring-0" />
                                            <span className="text-rose-400 font-bold">🟥 Czerwona kartka</span>
                                        </label>
                                        
                                        <select value={penaltyFor} onChange={e => setPenaltyFor(e.target.value)} className="bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-300 font-bold">
                                            <option value="none">Brak karnych</option>
                                            <option value="us">🎯 Rzut karny dla nas</option>
                                            <option value="them">⚠️ Rzut karny dla rywala</option>
                                        </select>
                                    </div>

                                    <button type="submit" className="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs uppercase">Zapisz Mecz</button>
                                </form>
                            </div>

                            <div className="space-y-2">
                                <h3 className="text-xs font-bold text-slate-400">Ostatnio Rozegrane Mecze</h3>
                                {matches.length > 0 ? (
                                    matches.map(m => (
                                        <div key={m.id} className="bg-slate-900 border border-slate-800 p-3 rounded-2xl flex justify-between items-center text-xs">
                                            <div className="space-y-1">
                                                <div className="flex items-center space-x-2">
                                                    <span className={`px-2 py-0.5 rounded font-black text-[9px] ${m.result === 'W' ? 'bg-emerald-500/20 text-emerald-400' : m.result === 'D' ? 'bg-amber-500/20 text-amber-400' : 'bg-rose-500/20 text-rose-400'}`}>
                                                        {m.result === 'W' ? 'WYGRANA' : m.result === 'D' ? 'REMIS' : 'PORAŻKA'}
                                                    </span>
                                                    <span className="text-slate-400 text-[10px] font-bold">{m.mode}</span>
                                                </div>
                                                <div className="font-bold text-slate-200">
                                                    vs {m.opponent} ({m.gf}:{m.ga})
                                                </div>
                                                {m.scorers && m.scorers.length > 0 && (
                                                    <div className="text-[10px] text-amber-300 font-medium">
                                                        ⚽ {m.scorers.map(s => `${s.name} ${s.minute ? `(${s.minute}')` : ''}`).join(', ')}
                                                    </div>
                                                )}
                                                <div className="flex gap-2 text-[9px]">
                                                    {m.redCard && <span className="text-rose-400 font-bold">🟥 Czerwona kartka</span>}
                                                    {m.penaltyFor === 'us' && <span className="text-emerald-400 font-bold">🎯 Karny dla nas</span>}
                                                    {m.penaltyFor === 'them' && <span className="text-amber-400 font-bold">⚠️ Karny rywala</span>}
                                                </div>
                                            </div>
                                            <button onClick={() => deleteMatch(m.id)} className="text-slate-600 hover:text-rose-400 font-bold text-sm p-1">✕</button>
                                        </div>
                                    ))
                                ) : (
                                    <p className="text-xs text-slate-500 text-center py-4">Brak rozegranych meczów.</p>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
