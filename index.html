<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA FC 27 Tracker & Squad Builder</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pitch-bg {
            background: #15803d;
            background-image: 
                linear-gradient(to bottom, rgba(255,255,255,0.12) 1px, transparent 1px),
                linear-gradient(to right, rgba(255,255,255,0.05) 50%, transparent 50%);
            background-size: 100% 40px, 100% 100%;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        const FORMATIONS = {
            '4-3-3 (1)': [
                { pos: 'LW', top: '22%', left: '18%' }, { pos: 'ST', top: '15%', left: '50%' }, { pos: 'RW', top: '22%', left: '82%' },
                { pos: 'LCM', top: '45%', left: '28%' }, { pos: 'CM', top: '50%', left: '50%' }, { pos: 'RCM', top: '45%', left: '72%' },
                { pos: 'LB', top: '72%', left: '15%' }, { pos: 'CB1', top: '75%', left: '38%' }, { pos: 'CB2', top: '75%', left: '62%' }, { pos: 'RB', top: '72%', left: '85%' },
                { pos: 'GK', top: '90%', left: '50%' }
            ],
            '4-3-3 (2) (Cofnięty)': [
                { pos: 'LW', top: '22%', left: '18%' }, { pos: 'ST', top: '15%', left: '50%' }, { pos: 'RW', top: '22%', left: '82%' },
                { pos: 'LCM', top: '42%', left: '30%' }, { pos: 'RCM', top: '42%', left: '70%' }, { pos: 'CDM', top: '56%', left: '50%' },
                { pos: 'LB', top: '72%', left: '15%' }, { pos: 'CB1', top: '75%', left: '38%' }, { pos: 'CB2', top: '75%', left: '62%' }, { pos: 'RB', top: '72%', left: '85%' },
                { pos: 'GK', top: '90%', left: '50%' }
            ],
            '4-3-3 (3) (Ofensywny)': [
                { pos: 'LW', top: '22%', left: '18%' }, { pos: 'ST', top: '15%', left: '50%' }, { pos: 'RW', top: '22%', left: '82%' },
                { pos: 'CAM', top: '35%', left: '50%' }, { pos: 'LCDM', top: '52%', left: '35%' }, { pos: 'RCDM', top: '52%', left: '65%' },
                { pos: 'LB', top: '72%', left: '15%' }, { pos: 'CB1', top: '75%', left: '38%' }, { pos: 'CB2', top: '75%', left: '62%' }, { pos: 'RB', top: '72%', left: '85%' },
                { pos: 'GK', top: '90%', left: '50%' }
            ],
            '4-4-2 (Klasyczna)': [
                { pos: 'ST1', top: '16%', left: '35%' }, { pos: 'ST2', top: '16%', left: '65%' },
                { pos: 'LM', top: '42%', left: '15%' }, { pos: 'CM1', top: '46%', left: '38%' }, { pos: 'CM2', top: '46%', left: '62%' }, { pos: 'RM', top: '42%', left: '85%' },
                { pos: 'LB', top: '72%', left: '15%' }, { pos: 'CB1', top: '75%', left: '38%' }, { pos: 'CB2', top: '75%', left: '62%' }, { pos: 'RB', top: '72%', left: '85%' },
                { pos: 'GK', top: '90%', left: '50%' }
            ],
            '4-2-3-1 (Wąsko)': [
                { pos: 'ST', top: '14%', left: '50%' },
                { pos: 'LAM', top: '28%', left: '24%' }, { pos: 'CAM', top: '30%', left: '50%' }, { pos: 'RAM', top: '28%', left: '76%' },
                { pos: 'LCDM', top: '52%', left: '35%' }, { pos: 'RCDM', top: '52%', left: '65%' },
                { pos: 'LB', top: '72%', left: '15%' }, { pos: 'CB1', top: '75%', left: '38%' }, { pos: 'CB2', top: '75%', left: '62%' }, { pos: 'RB', top: '72%', left: '85%' },
                { pos: 'GK', top: '90%', left: '50%' }
            ]
        };

        const BENCH_POSITIONS = ['SUB 1', 'SUB 2', 'SUB 3', 'SUB 4', 'SUB 5', 'SUB 6', 'SUB 7'];

        const STAGES = [
            { id: 1, label: 'I', isCheckpoint: true },
            { id: 2, label: 'II', isCheckpoint: false },
            { id: 3, label: 'III', isCheckpoint: false },
            { id: 4, label: 'IV', isCheckpoint: true },
            { id: 5, label: 'V', isCheckpoint: false },
            { id: 6, label: 'VI', isCheckpoint: false },
            { id: 7, label: 'VII', isCheckpoint: true },
            { id: 8, label: 'VIII', isCheckpoint: false },
            { id: 9, label: 'IX', isCheckpoint: false },
            { id: 10, label: 'X', isCheckpoint: true },
            { id: 11, label: 'XI', isCheckpoint: false },
            { id: 12, label: 'XII', isCheckpoint: false },
        ];

        function App() {
            const [tab, setTab] = React.useState('squad');
            const [matches, setMatches] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_matches')) || []);
            
            // Rozbudowane obiekty stanu Rivals
            const [rivals, setRivals] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_rivals_v2')) || { 
                division: 4, 
                currentStage: 4, 
                weeklyPoints: 7, 
                winStreak: 0, 
                wins: 0, 
                losses: 0, 
                draws: 0 
            });

            const [fut, setFut] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_fut')) || { wins: 0, losses: 0 });
            const [formation, setFormation] = React.useState(() => localStorage.getItem('eafc27_formation') || '4-3-3 (1)');
            const [squad, setSquad] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_squad')) || {});
            const [bench, setBench] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_bench')) || {});
            const [players, setPlayers] = React.useState(() => JSON.parse(localStorage.getItem('eafc27_players')) || []);

            const [selectedPos, setSelectedPos] = React.useState(null);
            const [isBenchSelection, setIsBenchSelection] = React.useState(false);
            const [playerName, setPlayerName] = React.useState('');
            const [playerOvr, setPlayerOvr] = React.useState('');
            const [playerCardType, setPlayerCardType] = React.useState('Złota');
            const [playerPhoto, setPlayerPhoto] = React.useState('');

            const [gfGoals, setGfGoals] = React.useState('');
            const [gaGoals, setGaGoals] = React.useState('');
            const [matchScorers, setMatchScorers] = React.useState([]);
            const [currentScorer, setCurrentScorer] = React.useState('');
            const [currentMinute, setCurrentMinute] = React.useState('');
            const [redCard, setRedCard] = React.useState(false);
            const [penaltyFor, setPenaltyFor] = React.useState('none');

            React.useEffect(() => {
                localStorage.setItem('eafc27_matches', JSON.stringify(matches));
                localStorage.setItem('eafc27_rivals_v2', JSON.stringify(rivals));
                localStorage.setItem('eafc27_fut', JSON.stringify(fut));
                localStorage.setItem('eafc27_formation', formation);
                localStorage.setItem('eafc27_squad', JSON.stringify(squad));
                localStorage.setItem('eafc27_bench', JSON.stringify(bench));
                localStorage.setItem('eafc27_players', JSON.stringify(players));
            }, [matches, rivals, fut, formation, squad, bench, players]);

            const capitalizeFirstLetter = (string) => {
                if (!string) return '';
                const trimmed = string.trim();
                return trimmed.charAt(0).toUpperCase() + trimmed.slice(1).toLowerCase();
            };

            const handleRivalsMatchOutcome = (result) => {
                setRivals(prev => {
                    let newStreak = prev.winStreak;
                    let newStage = prev.currentStage;
                    let addPts = 0;
                    let wins = prev.wins;
                    let draws = prev.draws;
                    let losses = prev.losses;

                    if (result === 'W') {
                        wins += 1;
                        addPts = 3;
                        newStreak += 1;
                        // Jeśli seria wygranych >= 2, przesuń o 2 kroki, w przeciwnym razie o 1 krok
                        const step = newStreak >= 2 ? 2 : 1;
                        newStage = Math.min(12, newStage + step);
                    } else if (result === 'D') {
                        draws += 1;
                        addPts = 1;
                        newStreak = 0; // Remis kasuje falę
                    } else if (result === 'L') {
                        losses += 1;
                        addPts = 0;
                        newStreak = 0; // Porażka kasuje falę
                        
                        // Cofy o 1 krok (z uwzględnieniem punktów kontrolnych / checkpointów)
                        if (newStage > 1) {
                            const currentStageObj = STAGES.find(s => s.id === newStage);
                            // Jeśli obecny krok nie jest bezpiecznym checkpointem, to cofamy o 1 krok
                            if (!currentStageObj || !currentStageObj.isCheckpoint) {
                                newStage = Math.max(1, newStage - 1);
                            }
                        }
                    }

                    return {
                        ...prev,
                        wins,
                        draws,
                        losses,
                        winStreak: newStreak,
                        currentStage: newStage,
                        weeklyPoints: prev.weeklyPoints + addPts
                    };
                });
            };

            const resetWeeklyPoints = () => {
                setRivals(prev => ({ ...prev, weeklyPoints: 0 }));
            };

            const openPositionModal = (pos, isBench) => {
                setSelectedPos(pos);
                setIsBenchSelection(isBench);
                const currentData = isBench ? bench[pos] : squad[pos];
                if (currentData) {
                    setPlayerName(currentData.name);
                    setPlayerOvr(currentData.ovr);
                    setPlayerCardType(currentData.cardType || 'Złota');
                    setPlayerPhoto(currentData.photo || '');
                } else {
                    setPlayerName('');
                    setPlayerOvr('');
                    setPlayerCardType('Złota');
                    setPlayerPhoto('');
                }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setPlayerPhoto(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const addMatch = (e) => {
                e.preventDefault();
                const form = e.target;
                const mode = form.mode.value;
                const gf = parseInt(gfGoals);
                const ga = parseInt(gaGoals);
                const result = gf > ga ? 'W' : gf < ga ? 'L' : 'D';

                const match = {
                    id: Date.now(),
                    mode,
                    opponent: form.opponent.value,
                    gf,
                    ga,
                    result,
                    scorers: matchScorers,
                    redCard,
                    penaltyFor
                };

                setMatches([match, ...matches]);

                if (mode === 'Division Rivals') {
                    handleRivalsMatchOutcome(result);
                } else if (mode === 'FUT Champions') {
                    setFut(prev => ({
                        ...prev,
                        wins: prev.wins + (result === 'W' ? 1 : 0),
                        losses: prev.losses + (result === 'L' ? 1 : 0)
                    }));
                }

                setGfGoals('');
                setGaGoals('');
                setMatchScorers([]);
                setRedCard(false);
                setPenaltyFor('none');
                form.reset();
            };

            const deleteMatch = (id) => {
                setMatches(matches.filter(m => m.id !== id));
            };

            const assignPlayer = (e) => {
                e.preventDefault();
                if (!selectedPos) return;

                const formattedName = capitalizeFirstLetter(playerName);
                const playerData = { 
                    name: formattedName, 
                    ovr: playerOvr || '80', 
                    cardType: playerCardType.trim(), 
                    photo: playerPhoto 
                };

                if (isBenchSelection) {
                    setBench({ ...bench, [selectedPos]: playerData });
                } else {
                    setSquad({ ...squad, [selectedPos]: playerData });
                }
                setSelectedPos(null);
            };

            return (
                <div className="max-w-md mx-auto p-3 pb-20">
                    <header className="text-center my-4">
                        <h1 className="text-2xl font-black text-emerald-400 tracking-wider">EA FC 27 TRACKER</h1>
                        <p className="text-[11px] text-slate-400">Twoje Mobilne Centrum Ultimate Team</p>
                    </header>

                    <div className="grid grid-cols-5 gap-1 bg-slate-900 p-1 rounded-xl mb-4 border border-slate-800 text-center text-[10px]">
                        <button onClick={() => setTab('squad')} className={`py-2 font-bold rounded-lg transition ${tab === 'squad' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}>Boisko</button>
                        <button onClick={() => setTab('players')} className={`py-2 font-bold rounded-lg transition ${tab === 'players' ? 'bg-amber-400 text-slate-950' : 'text-slate-400'}`}>Zawodnicy</button>
                        <button onClick={() => setTab('matches')} className={`py-2 font-bold rounded-lg transition ${tab === 'matches' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}>Mecze</button>
                        <button onClick={() => setTab('rivals')} className={`py-2 font-bold rounded-lg transition ${tab === 'rivals' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}>Rivals</button>
                        <button onClick={() => setTab('fut')} className={`py-2 font-bold rounded-lg transition ${tab === 'fut' ? 'bg-emerald-500 text-slate-950' : 'text-slate-400'}`}>FUT</button>
                    </div>

                    {/* ZAKŁADKA DIVISION RIVALS (Z DRABINKĄ) */}
                    {tab === 'rivals' && (
                        <div className="space-y-4">
                            <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-sm font-black text-slate-200 uppercase tracking-wide">DIVISION RIVALS</h2>
                                    <select 
                                        value={rivals.division} 
                                        onChange={e => setRivals({...rivals, division: Number(e.target.value)})} 
                                        className="bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-xs text-emerald-400 font-bold"
                                    >
                                        {[...Array(10)].map((_, i) => (
                                            <option key={10 - i} value={10 - i}>Dywizja {10 - i}</option>
                                        ))}
                                    </select>
                                </div>

                                {/* DRABINKA PROGRESU (CHECKPOINTY I KROKI) */}
                                <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                                    <div className="flex justify-between items-center text-[11px] font-bold">
                                        <span className="text-slate-400">Ścieżka Dywizji {rivals.division}</span>
                                        {rivals.winStreak >= 2 && (
                                            <span className="text-amber-400 animate-pulse bg-amber-400/10 px-2 py-0.5 rounded-full border border-amber-400/30">
                                                🔥 Na Fali (Awans x2)!
                                            </span>
                                        )}
                                    </div>

                                    {/* Oś z kroczkami */}
                                    <div className="relative flex items-center justify-between pt-6 pb-2 px-1 overflow-x-auto gap-1.5">
                                        <div className="absolute top-1/2 left-0 right-0 h-1 bg-slate-800 -translate-y-1/2 z-0"></div>
                                        
                                        {STAGES.map((st) => {
                                            const isCurrent = rivals.currentStage === st.id;
                                            const isPassed = rivals.currentStage > st.id;

                                            return (
                                                <div key={st.id} className="relative z-10 flex flex-col items-center flex-shrink-0">
                                                    {/* Wskaźnik gracza */}
                                                    {isCurrent && (
                                                        <div className="absolute -top-6 text-emerald-400 text-xs animate-bounce font-black">
                                                            ▼
                                                        </div>
                                                    )}
                                                    
                                                    {/* Kafelek Kroku */}
                                                    <div className={`w-7 h-7 rounded-lg border flex items-center justify-center text-[10px] font-bold transition-all ${
                                                        isCurrent 
                                                            ? 'bg-emerald-500 text-slate-950 border-emerald-300 scale-110 shadow-lg shadow-emerald-500/30 font-black' 
                                                            : isPassed 
                                                            ? 'bg-slate-800 text-emerald-400 border-emerald-600/40' 
                                                            : st.isCheckpoint 
                                                            ? 'bg-slate-900 text-amber-400 border-amber-500/50' 
                                                            : 'bg-slate-900 text-slate-500 border-slate-800'
                                                    }`}>
                                                        {st.label}
                                                    </div>

                                                    {/* Oznaczenie punktu kontrolnego */}
                                                    {st.isCheckpoint && (
                                                        <span className="text-[7px] text-amber-400 font-extrabold mt-1 uppercase">CP</span>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* KAFELEK NAGRÓD TYGODNIOWYCH (WYGLĄD JAK NA ZDJĘCIU Z EA FC 27) */}
                                <div className="bg-gradient-to-br from-slate-950 to-slate-900 p-4 rounded-xl border border-slate-800 flex justify-between items-center shadow-inner">
                                    <div className="space-y-1">
                                        <h3 className="text-xs font-bold text-slate-200">Nagrody Tygodniowe</h3>
                                        <p className="text-[10px] text-slate-400 max-w-[180px]">
                                            {rivals.weeklyPoints >= 30 
                                                ? 'Odblokowano ulepszone nagrody tygodniowe!' 
                                                : rivals.weeklyPoints >= 15 
                                                ? `Zdobądź jeszcze ${30 - rivals.weeklyPoints} pkt do ulepszonych nagród.` 
                                                : `Zdobądź jeszcze ${15 - rivals.weeklyPoints} pkt, aby odebrać nagrody.`}
                                        </p>
                                        <div className="pt-1">
                                            <span className="text-xs font-black text-emerald-400">{rivals.weeklyPoints} / 15 pkt</span>
                                            <span className="text-[10px] text-amber-400 font-bold ml-2">(Ulepszone: 30 pkt)</span>
                                        </div>
                                    </div>

                                    <div className="text-right flex flex-col items-end gap-2">
                                        <div className="w-12 h-16 bg-gradient-to-b from-blue-600 to-indigo-950 border border-blue-400/40 rounded-lg flex flex-col items-center justify-center shadow-lg relative overflow-hidden">
                                            <span className="text-[9px] font-black text-blue-200">FUT</span>
                                            <span className="text-[7px] text-slate-300 uppercase font-bold">Paczka</span>
                                        </div>
                                        <button onClick={resetWeeklyPoints} className="text-[9px] text-slate-500 underline hover:text-rose-400">Zresetuj tydzień</button>
                                    </div>
                                </div>

                                {/* SZYBKIE DODAWANIE MECZU W RIVALS */}
                                <div className="space-y-2 pt-1">
                                    <span className="text-[11px] font-bold text-slate-400 block">Szybka Aktualizacja Wyniku:</span>
                                    <div className="grid grid-cols-3 gap-2">
                                        <button onClick={() => handleRivalsMatchOutcome('W')} className="bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 font-bold py-2 rounded-xl text-xs hover:bg-emerald-500/30 transition"> Wygrana (+3 pkt)</button>
                                        <button onClick={() => handleRivalsMatchOutcome('D')} className="bg-amber-500/20 border border-amber-500/40 text-amber-400 font-bold py-2 rounded-xl text-xs hover:bg-amber-500/30 transition"> Remis (+1 pkt)</button>
                                        <button onClick={() => handleRivalsMatchOutcome('L')} className="bg-rose-500/20 border border-rose-500/40 text-rose-400 font-bold py-2 rounded-xl text-xs hover:bg-rose-500/30 transition"> Porażka (0 pkt)</button>
                                    </div>
                                </div>

                                {/* BILANS SPOTKAŃ */}
                                <div className="grid grid-cols-3 gap-2 text-center pt-2 border-t border-slate-800">
                                    <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800"><span className="block text-lg font-black text-emerald-400">{rivals.wins}</span><span className="text-[9px] text-slate-400 uppercase font-bold">Wygrane</span></div>
                                    <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800"><span className="block text-lg font-black text-amber-400">{rivals.draws}</span><span className="text-[9px] text-slate-400 uppercase font-bold">Remisy</span></div>
                                    <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800"><span className="block text-lg font-black text-rose-400">{rivals.losses}</span><span className="text-[9px] text-slate-400 uppercase font-bold">Porażki</span></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ZAKŁADKA BOISKO (SQUAD BUILDER) */}
                    {tab === 'squad' && (
                        <div className="space-y-3">
                            <div className="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800">
                                <span className="text-xs font-bold text-slate-300">Formacja:</span>
                                <select value={formation} onChange={e => setFormation(e.target.value)} className="bg-slate-950 border border-slate-800 px-2.5 py-1.5 rounded-lg text-xs font-bold text-emerald-400 max-w-[200px]">
                                    {Object.keys(FORMATIONS).map(f => (
                                        <option key={f} value={f}>{f}</option>
                                    ))}
                                </select>
                            </div>

                            <div className="relative pitch-bg h-[450px] rounded-2xl border-2 border-emerald-600/40 shadow-2xl overflow-hidden my-2">
                                <div className="absolute top-0 left-1/2 -translate-x-1/2 w-40 h-20 border-b-2 border-x-2 border-white/20"></div>
                                <div className="absolute bottom-0 left-1/2 -translate-x-1/2 w-48 h-24 border-t-2 border-x-2 border-white/20"></div>
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-28 h-28 border-2 border-white/20 rounded-full"></div>

                                {FORMATIONS[formation] && FORMATIONS[formation].map((item, idx) => {
                                    const pData = squad[item.pos];
                                    return (
                                        <div 
                                            key={idx} 
                                            style={{ top: item.top, left: item.left }}
                                            onClick={() => openPositionModal(item.pos, false)}
                                            className="absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer text-center group z-10"
                                        >
                                            <div className="w-12 h-15 rounded-lg border-2 flex flex-col items-center justify-center shadow-lg transition transform group-active:scale-95 overflow-hidden bg-gradient-to-b from-amber-100 via-amber-300 to-amber-600 text-slate-950 border-amber-200">
                                                {pData ? (
                                                    pData.photo ? (
                                                        <div className="w-full h-full relative flex items-center justify-center">
                                                            <img src={pData.photo} alt={pData.name} className="absolute inset-0 w-full h-full object-cover" />
                                                            <div className="absolute bottom-0 inset-x-0 bg-slate-950/70 text-[8px] font-black text-center text-amber-300 leading-tight py-0.5">
                                                                {pData.ovr} {pData.name.substring(0, 5)}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <>
                                                            <span className="text-[10px] font-black leading-none">{pData.ovr}</span>
                                                            <span className="text-[9px] font-extrabold uppercase leading-tight truncate px-0.5">{pData.name.substring(0, 6)}</span>
                                                        </>
                                                    )
                                                ) : (
                                                    <span className="text-[10px] font-bold text-emerald-400 bg-slate-950/80 w-full h-full flex items-center justify-center">+</span>
                                                )}
                                            </div>
                                            <span className="text-[9px] font-black bg-slate-950/90 text-slate-200 px-1 py-0.5 rounded shadow mt-0.5 block border border-slate-800">
                                                {item.pos}
                                            </span>
                                        </div>
                                    );
                                })}
                            </div>

                            {selectedPos && (
                                <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                                    <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl w-full max-w-xs space-y-4 shadow-2xl">
                                        <h3 className="text-sm font-bold text-slate-200 text-center uppercase">
                                            Pozycja: <span className="text-emerald-400">{selectedPos}</span>
                                        </h3>
                                        <form onSubmit={assignPlayer} className="space-y-3">
                                            <input 
                                                type="text" 
                                                placeholder="Nazwisko (np. Mbappe)" 
                                                required 
                                                value={playerName} 
                                                onChange={e => setPlayerName(e.target.value)}
                                                className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-slate-200 font-bold"
                                            />
                                            <div className="grid grid-cols-2 gap-2">
                                                <input 
                                                    type="number" 
                                                    placeholder="OVR (np. 91)" 
                                                    min="40" 
                                                    max="99" 
                                                    value={playerOvr} 
                                                    onChange={e => setPlayerOvr(e.target.value)}
                                                    className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-slate-200 font-bold"
                                                />
                                                <input 
                                                    type="text" 
                                                    placeholder="Karta (np. TOTY)" 
                                                    value={playerCardType} 
                                                    onChange={e => setPlayerCardType(e.target.value)}
                                                    className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-xs text-amber-300 font-bold"
                                                />
                                            </div>
                                            <div>
                                                <label className="text-[10px] text-slate-400 block mb-1">Zdjęcie z galerii:</label>
                                                <input 
                                                    type="file" 
                                                    accept="image/*" 
                                                    onChange={handleImageUpload}
                                                    className="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-300 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-emerald-500 file:text-slate-950"
                                                />
                                            </div>
                                            <div className="flex gap-2 pt-1">
                                                <button type="submit" className="flex-1 bg-emerald-500 text-slate-950 font-bold py-2 rounded-xl text-xs">Zapisz</button>
                                                <button type="button" onClick={() => setSelectedPos(null)} className="bg-slate-800 text-slate-400 font-bold px-3 py-2 rounded-xl text-xs">Anuluj</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* POZOSTAŁE ZAKŁADKI (MECZE, ZAWODNICY, FUT) */}
                    {tab === 'matches' && (
                        <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl">
                            <h2 className="text-sm font-bold text-slate-300 uppercase mb-3">Dodaj Mecz</h2>
                            <form onSubmit={addMatch} className="space-y-3">
                                <select name="mode" className="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-emerald-400 font-bold">
                                    <option value="Division Rivals">Division Rivals</option>
                                    <option value="FUT Champions">FUT Champions</option>
                                </select>
                                <input type="text" name="opponent" placeholder="Rywal" className="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-200" />
                                <div className="grid grid-cols-2 gap-2">
                                    <input type="number" value={gfGoals} onChange={e => setGfGoals(e.target.value)} placeholder="Twoje gole" required min="0" className="bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-200" />
                                    <input type="number" value={gaGoals} onChange={e => setGaGoals(e.target.value)} placeholder="Gole rywala" required min="0" className="bg-slate-950 border border-slate-800 p-2 rounded-xl text-xs text-slate-200" />
                                </div>
                                <button type="submit" className="w-full bg-emerald-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs uppercase">Zapisz Mecz</button>
                            </form>
                        </div>
                    )}

                    {tab === 'fut' && (
                        <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl space-y-4">
                            <h2 className="text-sm font-bold text-slate-300 uppercase">Finały FUT Champions</h2>
                            <div className="grid grid-cols-2 gap-3">
                                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                                    <span className="text-xs text-slate-400 block">Wygrane:</span>
                                    <span className="text-2xl font-black text-emerald-400">{fut.wins}</span>
                                </div>
                                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                                    <span className="text-xs text-slate-400 block">Porażki:</span>
                                    <span className="text-2xl font-black text-rose-400">{fut.losses}</span>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
