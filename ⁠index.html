<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EA FC Ultimate Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [tab, setTab] = useState('overview');
      const [matches, setMatches] = useState(() => JSON.parse(localStorage.getItem('fc_matches') || '[]'));
      const [legends, setLegends] = useState(() => JSON.parse(localStorage.getItem('fc_legends') || '[]'));
      const [rivalsData, setRivalsData] = useState(() => JSON.parse(localStorage.getItem('fc_rivals') || '{"div":"Div 4","pts":450,"target":"Div 2"}'));
      const [champsData, setChampsData] = useState(() => JSON.parse(localStorage.getItem('fc_champs') || '{"rank":"Rank 5","finWins":11,"finLosses":9}'));

      const [newMatch, setNewMatch] = useState({ mode: 'Rivals', homeScore: 0, awayScore: 0, mvp: '', notes: '' });
      const [newLegend, setNewLegend] = useState({ name: '', rating: 90, pos: 'ST', goals: 0, assists: 0, apps: 0, tag: 'Legenda Klubu' });

      useEffect(() => { localStorage.setItem('fc_matches', JSON.stringify(matches)); }, [matches]);
      useEffect(() => { localStorage.setItem('fc_legends', JSON.stringify(legends)); }, [legends]);
      useEffect(() => { localStorage.setItem('fc_rivals', JSON.stringify(rivalsData)); }, [rivalsData]);
      useEffect(() => { localStorage.setItem('fc_champs', JSON.stringify(champsData)); }, [champsData]);

      const addMatch = (e) => {
        e.preventDefault();
        const match = { ...newMatch, id: Date.now(), date: new Date().toLocaleDateString('pl-PL') };
        setMatches([match, ...matches]);
        setNewMatch({ mode: 'Rivals', homeScore: 0, awayScore: 0, mvp: '', notes: '' });
      };

      const addLegend = (e) => {
        e.preventDefault();
        if (!newLegend.name) return;
        setLegends([...legends, { ...newLegend, id: Date.now() }]);
        setNewLegend({ name: '', rating: 90, pos: 'ST', goals: 0, assists: 0, apps: 0, tag: 'Legenda Klubu' });
      };

      const wins = matches.filter(m => Number(m.homeScore) > Number(m.awayScore)).length;
      const draws = matches.filter(m => Number(m.homeScore) === Number(m.awayScore)).length;
      const losses = matches.filter(m => Number(m.homeScore) < Number(m.awayScore)).length;

      return (
        <div className="max-w-4xl mx-auto p-4 space-y-6 pb-20">
          <header className="flex justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800">
            <div>
              <h1 className="text-2xl font-bold bg-gradient-to-r from-yellow-400 to-amber-600 bg-clip-text text-transparent">
                EA FC STATS TRACKER
              </h1>
              <p className="text-xs text-slate-400">Centrum Statystyk Ultimate Team</p>
            </div>
            <div className="text-right">
              <span className="text-xs text-slate-500 block">Bilans ogólny</span>
              <span className="font-bold text-emerald-400">{wins}W</span> - <span className="font-bold text-slate-400">{draws}D</span> - <span className="font-bold text-rose-500">{losses}L</span>
            </div>
          </header>

          <nav className="flex space-x-2 bg-slate-900 p-1 rounded-lg border border-slate-800">
            {['overview', 'rivals', 'champs', 'legends'].map((t) => (
              <button
                key={t}
                onClick={() => setTab(t)}
                className={`flex-1 py-2 rounded-md text-xs sm:text-sm font-semibold capitalize transition ${tab === t ? 'bg-amber-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}
              >
                {t === 'overview' ? 'Przegląd' : t === 'rivals' ? 'Rivals' : t === 'champs' ? 'FUT Champs' : 'Legendy'}
              </button>
            ))}
          </nav>

          {tab === 'overview' && (
            <div className="space-y-6">
              <form onSubmit={addMatch} className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
                <h2 className="font-bold text-amber-400 text-sm">Dodaj nowy mecz</h2>
                <div className="grid grid-cols-2 gap-2 sm:grid-cols-4">
                  <select
                    value={newMatch.mode}
                    onChange={e => setNewMatch({...newMatch, mode: e.target.value})}
                    className="bg-slate-800 p-2 rounded text-sm text-white border border-slate-700"
                  >
                    <option>Rivals</option>
                    <option>FUT Champions</option>
                    <option>Squad Battles</option>
                  </select>
                  <input
                    type="number" placeholder="Gole zdobyte" value={newMatch.homeScore}
                    onChange={e => setNewMatch({...newMatch, homeScore: e.target.value})}
                    className="bg-slate-800 p-2 rounded text-sm text-white border border-slate-700"
                  />
                  <input
                    type="number" placeholder="Gole stracone" value={newMatch.awayScore}
                    onChange={e => setNewMatch({...newMatch, awayScore: e.target.value})}
                    className="bg-slate-800 p-2 rounded text-sm text-white border border-slate-700"
                  />
                  <input
                    type="text" placeholder="MVP Mecz" value={newMatch.mvp}
                    onChange={e => setNewMatch({...newMatch, mvp: e.target.value})}
                    className="bg-slate-800 p-2 rounded text-sm text-white border border-slate-700"
                  />
                </div>
                <button type="submit" className="w-full bg-amber-500 text-slate-950 font-bold py-2 rounded text-sm hover:bg-amber-400">
                  Zapisz Mecz
                </button>
              </form>

              <div className="space-y-2">
                <h2 className="font-bold text-slate-300 text-sm">Ostatnie mecze</h2>
                {matches.length === 0 && <p className="text-xs text-slate-500">Brak zapisanych meczów.</p>}
                {matches.map(m => (
                  <div key={m.id} className="bg-slate-900 p-3 rounded-lg border border-slate-800 flex justify-between items-center text-sm">
                    <div>
                      <span className="text-xs text-amber-400 font-bold mr-2">[{m.mode}]</span>
                      <span className="font-bold">{m.homeScore} : {m.awayScore}</span>
                      {m.mvp && <span className="text-xs text-slate-400 block">⭐ MVP: {m.mvp}</span>}
                    </div>
                    <span className="text-xs text-slate-500">{m.date}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab === 'rivals' && (
            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-4">
              <h2 className="font-bold text-amber-400">Ustawienia Division Rivals</h2>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label className="text-xs text-slate-400">Aktualna Dywizja</label>
                  <input
                    type="text" value={rivalsData.div}
                    onChange={e => setRivalsData({...rivalsData, div: e.target.value})}
                    className="w-full bg-slate-800 p-2 rounded text-sm text-white border border-slate-700 mt-1"
                  />
                </div>
                <div>
                  <label className="text-xs text-slate-400">Punkty do Nagród</label>
                  <input
                    type="number" value={rivalsData.pts}
                    onChange={e => setRivalsData({...rivalsData, pts: e.target.value})}
                    className="w-full bg-slate-800 p-2 rounded text-sm text-white border border-slate-700 mt-1"
                  />
                </div>
                <div>
                  <label className="text-xs text-slate-400">Cel Sezonowy</label>
                  <input
                    type="text" value={rivalsData.target}
                    onChange={e => setRivalsData({...rivalsData, target: e.target.value})}
                    className="w-full bg-slate-800 p-2 rounded text-sm text-white border border-slate-700 mt-1"
                  />
                </div>
              </div>
            </div>
          )}

          {tab === 'champs' && (
            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-4">
              <h2 className="font-bold text-amber-400">Ustawienia FUT Champions</h2>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label className="text-xs text-slate-400">Ostatnia Ranga</label>
                  <input
                    type="text" value={champsData.rank}
                    onChange={e => setChampsData({...champsData, rank: e.target.value})}
                    className="w-full bg-slate-800 p-2 rounded text-sm text-white border border-slate-700 mt-1"
                  />
                </div>
                <div>
                  <label className="text-xs text-slate-400">Finały Wygrane</label>
                  <input
                    type="number" value={champsData.finWins}
                    onChange={e => setChampsData({...champsData, finWins: e.target.value})}
                    className="w-full bg-slate-800 p-2 rounded text-sm text-white border border-slate-700 mt-1"
                  />
                </div>
                <div>
                  <label className="text-xs text-slate-400">Finały Przegrane</label>
                  <input
                    type="number" value={champsData.finLosses}
                    onChange={e => setChampsData({...champsData, finLosses: e.target.value})}
                    className="w-full bg-slate-800 p-2 rounded text-sm text-white border border-slate-700 mt-1"
                  />
                </div>
              </div>
            </div>
          )}

          {tab === 'legends' && (
            <div className="space-y-6">
              <form onSubmit={addLegend} className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
                <h2 className="font-bold text-amber-400 text-sm">Dodaj Legendę Klubu</h2>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  <input
                    type="text" placeholder="Imię / Nazwisko" value={newLegend.name}
                    onChange={e => setNewLegend({...newLegend, name: e.target.value})}
                    className="bg-slate-800 p-2 rounded text-sm text-white border border-slate-700"
                  />
                  <input
                    type="number" placeholder="OVR" value={newLegend.rating}
                    onChange={e => setNewLegend({...newLegend, rating: e.target.value})}
                    className="bg-slate-800 p-2 rounded text-sm text-white border border-slate-700"
                  />
                  <input
                    type="number" placeholder="Bramki" value={newLegend.goals}
                    onChange={e => setNewLegend({...newLegend, goals: e.target.value})}
                    className="bg-slate-800 p-2 rounded text-sm text-white border border-slate-700"
                  />
                  <input
                    type="text" placeholder="Tytuł (np. Król Strzelców)" value={newLegend.tag}
                    onChange={e => setNewLegend({...newLegend, tag: e.target.value})}
                    className="bg-slate-800 p-2 rounded text-sm text-white border border-slate-700"
                  />
                </div>
                <button type="submit" className="w-full bg-amber-500 text-slate-950 font-bold py-2 rounded text-sm hover:bg-amber-400">
                  Dodaj Legendę
                </button>
              </form>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {legends.map(l => (
                  <div key={l.id} className="bg-slate-900 p-4 rounded-xl border border-amber-500/30 flex justify-between items-center">
                    <div>
                      <span className="text-xs text-amber-400 font-bold uppercase">{l.tag}</span>
                      <h3 className="text-lg font-bold">{l.name}</h3>
                      <p className="text-xs text-slate-400">{l.goals} Goli / {l.assists} Asyst</p>
                    </div>
                    <div className="text-2xl font-black text-amber-400 border-2 border-amber-400 rounded-lg px-3 py-1">
                      {l.rating}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
